# ==========================================================
# AZURE DEVOPS TERRAFORM CI PIPELINE
# ==========================================================

trigger:
- main


# ==========================================================
# SELF HOSTED AGENT
# ==========================================================

pool:
  name: arjun
  demands:
  - Agent.Name -equals arjun_agent


# ==========================================================
# VARIABLES
# ==========================================================

variables:

  TF_WORKING_DIR: '$(Build.SourcesDirectory)\environment\dev'

  CSV_FILE: '$(Build.SourcesDirectory)\environment\dev\terraform_input_sheet.csv'

  TFVARS_FILE: '$(Build.SourcesDirectory)\environment\dev\terraform.tfvars'

  TFVARS_SCRIPT: '$(Build.SourcesDirectory)\environment\dev\tfvars-generate.ps1'

  # TELEGRAM BOT VARIABLES
  BOT_TOKEN: '8883973582:AAHm94WuwWyhR1Gg12o99y7RXEjk9gDmneo'
  CHAT_ID: '6892173127'


# ==========================================================
# STAGES
# ==========================================================

stages:

# ==========================================================
# STAGE 1: BUILD
# ==========================================================

- stage: Build
  displayName: 'Build'
  jobs:
  - job: TerraformBuild
    displayName: 'Terraform Build'
    steps:

    - checkout: self
      displayName: 'Checkout Repository'

    - task: PowerShell@2
      displayName: 'Generate terraform.tfvars'
      inputs:
        targetType: filePath
        filePath: '$(TFVARS_SCRIPT)'
        arguments: >
          -CsvPath "$(CSV_FILE)"
          -OutputPath "$(TFVARS_FILE)"
        pwsh: false

    - powershell: |
        Set-Location "$(TF_WORKING_DIR)"
        if (-not (Test-Path "$(TFVARS_FILE)")) {
            Write-Error "terraform.tfvars was not generated."
            exit 1
        }
        Write-Host "terraform.tfvars generated successfully."
      displayName: 'Verify terraform.tfvars'

    - powershell: |
        Set-Location "$(TF_WORKING_DIR)"
        terraform fmt -recursive
        if ($LASTEXITCODE -ne 0) {
            Write-Error "Terraform formatting failed."
            exit $LASTEXITCODE
        }
      displayName: 'Terraform Format'

    - powershell: |
        Set-Location "$(TF_WORKING_DIR)"
        terraform init `
          -backend-config="backend.conf" `
          -input=false `
          -no-color
        if ($LASTEXITCODE -ne 0) {
            Write-Error "Terraform init failed."
            exit $LASTEXITCODE
        }
      displayName: 'Terraform Init'

    # ------------------------------------------------------
    # BUILD NOTIFICATIONS (Fixed for Windows)
    # ------------------------------------------------------
    - powershell: |
        $MESSAGE="✅ <b>BUILD Stage Success!</b>%0A%0A📦 <b>Project:</b> $(System.TeamProject)%0A⚙️ <b>Pipeline:</b> $(Build.DefinitionName)%0A🔢 <b>View Run:</b> <a href='$(System.CollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)'>Run $(Build.BuildNumber)</a>"
        curl.exe -s -X POST "https://api.telegram.org/bot$(BOT_TOKEN)/sendMessage" -d chat_id="$(CHAT_ID)" -d text="$MESSAGE" -d parse_mode="HTML" -d disable_web_page_preview="true"
      displayName: 'Alert - Build Success'
      condition: succeeded()

    - powershell: |
        $MESSAGE="❌ <b>BUILD Stage Failed!</b>%0A%0A📦 <b>Project:</b> $(System.TeamProject)%0A⚙️ <b>Pipeline:</b> $(Build.DefinitionName)%0A🚨 <b>Check Logs:</b> <a href='$(System.CollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)'>Click Here</a>"
        curl.exe -s -X POST "https://api.telegram.org/bot$(BOT_TOKEN)/sendMessage" -d chat_id="$(CHAT_ID)" -d text="$MESSAGE" -d parse_mode="HTML" -d disable_web_page_preview="true"
      displayName: 'Alert - Build Failed'
      condition: failed()


# ==========================================================
# STAGE 2: TEST
# ==========================================================

- stage: Test
  displayName: 'Test'
  dependsOn: Build
  condition: succeeded()
  jobs:
  - job: TerraformTest
    displayName: 'Terraform Test'
    steps:

    - checkout: self
      displayName: 'Checkout Repository'

    - task: PowerShell@2
      displayName: 'Generate terraform.tfvars'
      inputs:
        targetType: filePath
        filePath: '$(TFVARS_SCRIPT)'
        arguments: >
          -CsvPath "$(CSV_FILE)"
          -OutputPath "$(TFVARS_FILE)"
        pwsh: false

    - powershell: |
        Set-Location "$(TF_WORKING_DIR)"
        terraform init `
          -backend-config="backend.conf" `
          -input=false `
          -no-color
        if ($LASTEXITCODE -ne 0) {
            Write-Error "Terraform init failed."
            exit $LASTEXITCODE
        }
      displayName: 'Terraform Init'

    - powershell: |
        Set-Location "$(TF_WORKING_DIR)"
        terraform validate -no-color
        if ($LASTEXITCODE -ne 0) {
            Write-Error "Terraform validation failed."
            exit $LASTEXITCODE
        }
      displayName: 'Terraform Validate'

    - powershell: |
        tfsec --version
        if ($LASTEXITCODE -ne 0) {
            Write-Error "tfsec is not installed on the self-hosted agent."
            exit $LASTEXITCODE
        }
      displayName: 'Check tfsec'

    - powershell: |
        Set-Location "$(TF_WORKING_DIR)"
        tfsec . --format default
        if ($LASTEXITCODE -ne 0) {
            Write-Error "tfsec security scan failed."
            exit $LASTEXITCODE
        }
      displayName: 'tfsec Security Scan'

    # ------------------------------------------------------
    # TEST NOTIFICATIONS (Fixed for Windows)
    # ------------------------------------------------------
    - powershell: |
        $MESSAGE="✅ <b>TEST Stage Success!</b> (Validation & Security Scan Passed)%0A%0A📦 <b>Project:</b> $(System.TeamProject)%0A⚙️ <b>Pipeline:</b> $(Build.DefinitionName)%0A🔢 <b>View Run:</b> <a href='$(System.CollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)'>Run $(Build.BuildNumber)</a>"
        curl.exe -s -X POST "https://api.telegram.org/bot$(BOT_TOKEN)/sendMessage" -d chat_id="$(CHAT_ID)" -d text="$MESSAGE" -d parse_mode="HTML" -d disable_web_page_preview="true"
      displayName: 'Alert - Test Success'
      condition: succeeded()

    - powershell: |
        $MESSAGE="❌ <b>TEST Stage Failed!</b>%0A%0A📦 <b>Project:</b> $(System.TeamProject)%0A⚙️ <b>Pipeline:</b> $(Build.DefinitionName)%0A🚨 <b>Check Logs:</b> <a href='$(System.CollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)'>Click Here</a>"
        curl.exe -s -X POST "https://api.telegram.org/bot$(BOT_TOKEN)/sendMessage" -d chat_id="$(CHAT_ID)" -d text="$MESSAGE" -d parse_mode="HTML" -d disable_web_page_preview="true"
      displayName: 'Alert - Test Failed'
      condition: failed()


# ==========================================================
# STAGE 3: PLAN
# ==========================================================

- stage: Plan
  displayName: 'Terraform Plan'
  dependsOn: Test
  condition: succeeded()
  jobs:
  - job: TerraformPlan
    displayName: 'Terraform Plan'
    steps:

    - checkout: self
      displayName: 'Checkout Repository'

    - task: PowerShell@2
      displayName: 'Generate terraform.tfvars'
      inputs:
        targetType: filePath
        filePath: '$(TFVARS_SCRIPT)'
        arguments: >
          -CsvPath "$(CSV_FILE)"
          -OutputPath "$(TFVARS_FILE)"
        pwsh: false

    - powershell: |
        Set-Location "$(TF_WORKING_DIR)"
        if (-not (Test-Path "$(TFVARS_FILE)")) {
            Write-Error "terraform.tfvars not found."
            exit 1
        }
      displayName: 'Verify terraform.tfvars'

    - powershell: |
        Set-Location "$(TF_WORKING_DIR)"
        terraform init `
          -backend-config="backend.conf" `
          -input=false `
          -no-color
        if ($LASTEXITCODE -ne 0) {
            Write-Error "Terraform init failed."
            exit $LASTEXITCODE
        }
      displayName: 'Terraform Init'

    - powershell: |
        Set-Location "$(TF_WORKING_DIR)"
        terraform plan `
          -input=false `
          -out=tfplan `
          -no-color
        if ($LASTEXITCODE -ne 0) {
            Write-Error "Terraform plan failed."
            exit $LASTEXITCODE
        }
      displayName: 'Terraform Plan'

    - task: PublishPipelineArtifact@1
      displayName: 'Publish Terraform Plan'
      inputs:
        targetPath: '$(TF_WORKING_DIR)\tfplan'
        artifact: 'terraform-plan'
        publishLocation: 'pipeline'

    # ------------------------------------------------------
    # PLAN NOTIFICATIONS (Fixed for Windows)
    # ------------------------------------------------------
    - powershell: |
        $MESSAGE="✅ <b>PLAN Stage Success!</b> (Terraform Plan Generated)%0A%0A📦 <b>Project:</b> $(System.TeamProject)%0A⚙️ <b>Pipeline:</b> $(Build.DefinitionName)%0A🔢 <b>View Run:</b> <a href='$(System.CollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)'>Run $(Build.BuildNumber)</a>"
        curl.exe -s -X POST "https://api.telegram.org/bot$(BOT_TOKEN)/sendMessage" -d chat_id="$(CHAT_ID)" -d text="$MESSAGE" -d parse_mode="HTML" -d disable_web_page_preview="true"
      displayName: 'Alert - Plan Success'
      condition: succeeded()

    - powershell: |
        $MESSAGE="❌ <b>PLAN Stage Failed!</b>%0A%0A📦 <b>Project:</b> $(System.TeamProject)%0A⚙️ <b>Pipeline:</b> $(Build.DefinitionName)%0A🚨 <b>Check Logs:</b> <a href='$(System.CollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)'>Click Here</a>"
        curl.exe -s -X POST "https://api.telegram.org/bot$(BOT_TOKEN)/sendMessage" -d chat_id="$(CHAT_ID)" -d text="$MESSAGE" -d parse_mode="HTML" -d disable_web_page_preview="true"
      displayName: 'Alert - Plan Failed'
      condition: failed()