# ==========================================================
# AZURE DEVOPS TERRAFORM CI PIPELINE
# ==========================================================

trigger:
- main

# ==========================================================
# SELF HOSTED AGENT
# ==========================================================

pool:
  name: arjun
  demands:
  - Agent.Name -equals arjun_agent


# ==========================================================
# VARIABLES
# ==========================================================

variables:

  TF_WORKING_DIR: '$(Build.SourcesDirectory)\environment\dev'

  CSV_FILE: '$(Build.SourcesDirectory)\environment\dev\terraform_input_sheet.csv'

  TFVARS_FILE: '$(Build.SourcesDirectory)\environment\dev\terraform.tfvars'

  TFVARS_SCRIPT: '$(Build.SourcesDirectory)\environment\dev\tfvars-generate.ps1'


# ==========================================================
# STAGES
# ==========================================================

stages:


# ==========================================================
# STAGE 1
# TERRAFORM VALIDATE
# ==========================================================

- stage: Terraform_Validate

  displayName: 'Terraform Validate'

  jobs:

  - job: TerraformValidate

    displayName: 'Terraform Validate'

    steps:

    # ------------------------------------------------------
    # Checkout
    # ------------------------------------------------------

    - checkout: self

      displayName: 'Checkout Repository'


    # ------------------------------------------------------
    # Generate TFVars
    # ------------------------------------------------------

    - task: PowerShell@2

      displayName: 'Generate terraform.tfvars'

      inputs:

        targetType: filePath

        filePath: '$(TFVARS_SCRIPT)'

        arguments: >
          -CsvPath "$(CSV_FILE)"
          -OutputPath "$(TFVARS_FILE)"

        pwsh: false


    # ------------------------------------------------------
    # Terraform Format
    # ------------------------------------------------------

    - powershell: |

        Set-Location "$(TF_WORKING_DIR)"

        Write-Host "Running Terraform Format..."

        terraform fmt -recursive

        if ($LASTEXITCODE -ne 0) {

            Write-Error "Terraform formatting failed."

            exit $LASTEXITCODE
        }

        Write-Host "Terraform formatting completed."

      displayName: 'Terraform Format'


    # ------------------------------------------------------
    # Terraform Init
    # ------------------------------------------------------

    - powershell: |

        Set-Location "$(TF_WORKING_DIR)"

        Write-Host "Running Terraform Init..."

        terraform init `
          -backend-config="backend.conf" `
          -input=false `
          -no-color

        if ($LASTEXITCODE -ne 0) {

            Write-Error "Terraform init failed."

            exit $LASTEXITCODE
        }

        Write-Host "Terraform Init successful."

      displayName: 'Terraform Init'


    # ------------------------------------------------------
    # Terraform Validate
    # ------------------------------------------------------

    - powershell: |

        Set-Location "$(TF_WORKING_DIR)"

        Write-Host "Running Terraform Validate..."

        terraform validate -no-color

        if ($LASTEXITCODE -ne 0) {

            Write-Error "Terraform validation failed."

            exit $LASTEXITCODE
        }

        Write-Host "Terraform validation successful."

      displayName: 'Terraform Validate'


# ==========================================================
# STAGE 2
# TFSEC SECURITY SCAN
# ==========================================================

- stage: Tfsec_Security

  displayName: 'tfsec Security Scan'

  dependsOn: Terraform_Validate

  condition: succeeded()

  jobs:

  - job: TfsecSecurity

    displayName: 'tfsec Security Scan'

    steps:

    # ------------------------------------------------------
    # Checkout
    # ------------------------------------------------------

    - checkout: self

      displayName: 'Checkout Repository'


    # ------------------------------------------------------
    # Verify tfsec
    # ------------------------------------------------------

    - powershell: |

        Write-Host "=========================================="
        Write-Host " tfsec Security Scan"
        Write-Host "=========================================="

        tfsec --version

        if ($LASTEXITCODE -ne 0) {

            Write-Error "tfsec is not installed on the self-hosted agent."

            exit $LASTEXITCODE
        }

      displayName: 'Check tfsec'


    # ------------------------------------------------------
    # Run tfsec
    # ------------------------------------------------------

    - powershell: |

        Set-Location "$(TF_WORKING_DIR)"

        Write-Host "Running tfsec security scan..."

        tfsec . --format default

        if ($LASTEXITCODE -ne 0) {

            Write-Error "tfsec security scan failed."

            exit $LASTEXITCODE
        }

        Write-Host "tfsec security scan passed."

      displayName: 'tfsec Security Scan'


# ==========================================================
# STAGE 3
# TERRAFORM PLAN
# ==========================================================

- stage: Terraform_Plan

  displayName: 'Terraform Plan'

  dependsOn: Tfsec_Security

  condition: succeeded()

  jobs:

  - job: TerraformPlan

    displayName: 'Terraform Plan'

    steps:

    # ------------------------------------------------------
    # Checkout
    # ------------------------------------------------------

    - checkout: self

      displayName: 'Checkout Repository'


    # ------------------------------------------------------
    # Generate TFVars
    # ------------------------------------------------------

    - task: PowerShell@2

      displayName: 'Generate terraform.tfvars'

      inputs:

        targetType: filePath

        filePath: '$(TFVARS_SCRIPT)'

        arguments: >
          -CsvPath "$(CSV_FILE)"
          -OutputPath "$(TFVARS_FILE)"

        pwsh: false


    # ------------------------------------------------------
    # Terraform Init
    # ------------------------------------------------------

    - powershell: |

        Set-Location "$(TF_WORKING_DIR)"

        Write-Host "Running Terraform Init..."

        terraform init `
          -backend-config="backend.conf" `
          -input=false `
          -no-color

        if ($LASTEXITCODE -ne 0) {

            Write-Error "Terraform init failed."

            exit $LASTEXITCODE
        }

      displayName: 'Terraform Init'


    # ------------------------------------------------------
    # Terraform Plan
    # ------------------------------------------------------

    - powershell: |

        Set-Location "$(TF_WORKING_DIR)"

        Write-Host "=========================================="
        Write-Host " Terraform Plan"
        Write-Host "=========================================="

        terraform plan `
          -input=false `
          -out=tfplan `
          -no-color

        if ($LASTEXITCODE -ne 0) {

            Write-Error "Terraform plan failed."

            exit $LASTEXITCODE
        }

        Write-Host "Terraform Plan completed successfully."

      displayName: 'Terraform Plan'


    # ------------------------------------------------------
    # Publish Plan
    # ------------------------------------------------------

    - task: PublishPipelineArtifact@1

      displayName: 'Publish Terraform Plan'

      inputs:

        targetPath: '$(TF_WORKING_DIR)\tfplan'

        artifact: 'terraform-plan'

        publishLocation: 'pipeline'