# ==========================================================
# AZURE DEVOPS TERRAFORM CI PIPELINE
# ==========================================================

trigger:
- main


# ==========================================================
# SELF HOSTED AGENT
# ==========================================================

pool:
  name: arjun
  demands:
  - Agent.Name -equals arjun_agent


# ==========================================================
# VARIABLES
# ==========================================================

variables:

  TF_WORKING_DIR: '$(Build.SourcesDirectory)\environment\dev'

  CSV_FILE: '$(Build.SourcesDirectory)\environment\dev\terraform_input_sheet.csv'

  TFVARS_FILE: '$(Build.SourcesDirectory)\environment\dev\terraform.tfvars'

  TFVARS_SCRIPT: '$(Build.SourcesDirectory)\environment\dev\tfvars-generate.ps1'


# ==========================================================
# STAGES
# ==========================================================

stages:


# ==========================================================
# STAGE 1
# BUILD
# ==========================================================

- stage: Build

  displayName: 'Build'

  jobs:

  - job: TerraformBuild

    displayName: 'Terraform Build'

    steps:

    # ------------------------------------------------------
    # CHECKOUT
    # ------------------------------------------------------

    - checkout: self

      displayName: 'Checkout Repository'


    # ------------------------------------------------------
    # GENERATE TFVARS
    # ------------------------------------------------------

    - task: PowerShell@2

      displayName: 'Generate terraform.tfvars'

      inputs:

        targetType: filePath

        filePath: '$(TFVARS_SCRIPT)'

        arguments: >
          -CsvPath "$(CSV_FILE)"
          -OutputPath "$(TFVARS_FILE)"

        pwsh: false


    # ------------------------------------------------------
    # VERIFY TFVARS
    # ------------------------------------------------------

    - powershell: |

        Set-Location "$(TF_WORKING_DIR)"

        Write-Host "=========================================="
        Write-Host " Generated Terraform TFVARS"
        Write-Host "=========================================="

        if (-not (Test-Path "$(TFVARS_FILE)")) {

            Write-Error "terraform.tfvars was not generated."

            exit 1
        }

        Write-Host "terraform.tfvars generated successfully."

      displayName: 'Verify terraform.tfvars'


    # ------------------------------------------------------
    # TERRAFORM FORMAT
    # ------------------------------------------------------

    - powershell: |

        Set-Location "$(TF_WORKING_DIR)"

        Write-Host "=========================================="
        Write-Host " Terraform Format"
        Write-Host "=========================================="

        terraform fmt -recursive

        if ($LASTEXITCODE -ne 0) {

            Write-Error "Terraform formatting failed."

            exit $LASTEXITCODE
        }

        Write-Host "Terraform formatting completed successfully."

      displayName: 'Terraform Format'


    # ------------------------------------------------------
    # TERRAFORM INIT
    # ------------------------------------------------------

    - powershell: |

        Set-Location "$(TF_WORKING_DIR)"

        Write-Host "=========================================="
        Write-Host " Terraform Init"
        Write-Host "=========================================="

        terraform init `
          -backend-config="backend.conf" `
          -input=false `
          -no-color

        if ($LASTEXITCODE -ne 0) {

            Write-Error "Terraform init failed."

            exit $LASTEXITCODE
        }

        Write-Host "Terraform Init completed successfully."

      displayName: 'Terraform Init'


# ==========================================================
# STAGE 2
# TEST
# ==========================================================

- stage: Test

  displayName: 'Test'

  dependsOn: Build

  condition: succeeded()

  jobs:

  - job: TerraformTest

    displayName: 'Terraform Test'

    steps:

    # ------------------------------------------------------
    # CHECKOUT
    # ------------------------------------------------------

    - checkout: self

      displayName: 'Checkout Repository'


    # ------------------------------------------------------
    # GENERATE TFVARS
    # ------------------------------------------------------

    - task: PowerShell@2

      displayName: 'Generate terraform.tfvars'

      inputs:

        targetType: filePath

        filePath: '$(TFVARS_SCRIPT)'

        arguments: >
          -CsvPath "$(CSV_FILE)"
          -OutputPath "$(TFVARS_FILE)"

        pwsh: false


    # ------------------------------------------------------
    # TERRAFORM INIT
    # ------------------------------------------------------

    - powershell: |

        Set-Location "$(TF_WORKING_DIR)"

        Write-Host "=========================================="
        Write-Host " Terraform Init"
        Write-Host "=========================================="

        terraform init `
          -backend-config="backend.conf" `
          -input=false `
          -no-color

        if ($LASTEXITCODE -ne 0) {

            Write-Error "Terraform init failed."

            exit $LASTEXITCODE
        }

        Write-Host "Terraform Init successful."

      displayName: 'Terraform Init'


    # ------------------------------------------------------
    # TERRAFORM VALIDATE
    # ------------------------------------------------------

    - powershell: |

        Set-Location "$(TF_WORKING_DIR)"

        Write-Host "=========================================="
        Write-Host " Terraform Validate"
        Write-Host "=========================================="

        terraform validate -no-color

        if ($LASTEXITCODE -ne 0) {

            Write-Error "Terraform validation failed."

            exit $LASTEXITCODE
        }

        Write-Host "Terraform validation successful."

      displayName: 'Terraform Validate'


    # ------------------------------------------------------
    # VERIFY TFSEC
    # ------------------------------------------------------

    - powershell: |

        Write-Host "=========================================="
        Write-Host " tfsec Version"
        Write-Host "=========================================="

        tfsec --version

        if ($LASTEXITCODE -ne 0) {

            Write-Error "tfsec is not installed on the self-hosted agent."

            exit $LASTEXITCODE
        }

      displayName: 'Check tfsec'


    # ------------------------------------------------------
    # TFSEC SECURITY SCAN
    # ------------------------------------------------------

    - powershell: |

        Set-Location "$(TF_WORKING_DIR)"

        Write-Host "=========================================="
        Write-Host " tfsec Security Scan"
        Write-Host "=========================================="

        tfsec . --format default

        if ($LASTEXITCODE -ne 0) {

            Write-Error "tfsec security scan failed."

            exit $LASTEXITCODE
        }

        Write-Host "tfsec security scan passed successfully."

      displayName: 'tfsec Security Scan'


# ==========================================================
# STAGE 3
# PLAN
# ==========================================================

- stage: Plan

  displayName: 'Terraform Plan'

  dependsOn: Test

  condition: succeeded()

  jobs:

  - job: TerraformPlan

    displayName: 'Terraform Plan'

    steps:

    # ------------------------------------------------------
    # CHECKOUT
    # ------------------------------------------------------

    - checkout: self

      displayName: 'Checkout Repository'


    # ------------------------------------------------------
    # GENERATE TFVARS
    # ------------------------------------------------------

    - task: PowerShell@2

      displayName: 'Generate terraform.tfvars'

      inputs:

        targetType: filePath

        filePath: '$(TFVARS_SCRIPT)'

        arguments: >
          -CsvPath "$(CSV_FILE)"
          -OutputPath "$(TFVARS_FILE)"

        pwsh: false


    # ------------------------------------------------------
    # VERIFY TFVARS
    # ------------------------------------------------------

    - powershell: |

        Set-Location "$(TF_WORKING_DIR)"

        if (-not (Test-Path "$(TFVARS_FILE)")) {

            Write-Error "terraform.tfvars not found."

            exit 1
        }

        Write-Host "terraform.tfvars is available."

      displayName: 'Verify terraform.tfvars'


    # ------------------------------------------------------
    # TERRAFORM INIT
    # ------------------------------------------------------

    - powershell: |

        Set-Location "$(TF_WORKING_DIR)"

        Write-Host "=========================================="
        Write-Host " Terraform Init"
        Write-Host "=========================================="

        terraform init `
          -backend-config="backend.conf" `
          -input=false `
          -no-color

        if ($LASTEXITCODE -ne 0) {

            Write-Error "Terraform init failed."

            exit $LASTEXITCODE
        }

        Write-Host "Terraform Init successful."

      displayName: 'Terraform Init'


    # ------------------------------------------------------
    # TERRAFORM PLAN
    # ------------------------------------------------------

    - powershell: |

        Set-Location "$(TF_WORKING_DIR)"

        Write-Host "=========================================="
        Write-Host " Terraform Plan"
        Write-Host "=========================================="

        terraform plan `
          -input=false `
          -out=tfplan `
          -no-color

        if ($LASTEXITCODE -ne 0) {

            Write-Error "Terraform plan failed."

            exit $LASTEXITCODE
        }

        Write-Host "Terraform Plan completed successfully."

      displayName: 'Terraform Plan'


    # ------------------------------------------------------
    # PUBLISH TERRAFORM PLAN
    # ------------------------------------------------------

    - task: PublishPipelineArtifact@1

      displayName: 'Publish Terraform Plan'

      inputs:

        targetPath: '$(TF_WORKING_DIR)\tfplan'

        artifact: 'terraform-plan'

        publishLocation: 'pipeline'