# ==========================================================
# AZURE DEVOPS TERRAFORM CI PIPELINE
# ==========================================================

trigger:
- main


# ==========================================================
# MICROSOFT HOSTED AGENT
# ==========================================================

pool:
  vmImage: 'ubuntu-latest'


# ==========================================================
# VARIABLES
# ==========================================================

variables:

  # Linux (Ubuntu) ke liye forward slashes (/) use kiye gaye hain
  TF_WORKING_DIR: '$(Build.SourcesDirectory)/environment/dev'

  CSV_FILE: '$(Build.SourcesDirectory)/environment/dev/terraform_input_sheet.csv'

  TFVARS_FILE: '$(Build.SourcesDirectory)/environment/dev/terraform.tfvars'

  TFVARS_SCRIPT: '$(Build.SourcesDirectory)/environment/dev/tfvars-generate.ps1'

  # TELEGRAM BOT VARIABLES
  BOT_TOKEN: '8883973582:AAHm94WuwWyhR1Gg12o99y7RXEjk9gDmneo'
  CHAT_ID: '6892173127'


# ==========================================================
# STAGES
# ==========================================================

stages:


# ==========================================================
# STAGE 1
# BUILD
# ==========================================================

- stage: Build

  displayName: 'Build'

  jobs:

  - job: TerraformBuild

    displayName: 'Terraform Build'

    steps:

    # ------------------------------------------------------
    # CHECKOUT
    # ------------------------------------------------------

    - checkout: self

      displayName: 'Checkout Repository'


    # ------------------------------------------------------
    # GENERATE TFVARS
    # ------------------------------------------------------

    - task: PowerShell@2

      displayName: 'Generate terraform.tfvars'

      inputs:

        targetType: filePath

        filePath: '$(TFVARS_SCRIPT)'

        arguments: >
          -CsvPath "$(CSV_FILE)"
          -OutputPath "$(TFVARS_FILE)"

        # Ubuntu ke liye ise true karna zaroori hai
        pwsh: true


    # ------------------------------------------------------
    # VERIFY TFVARS
    # ------------------------------------------------------

    - powershell: |

        Set-Location "$(TF_WORKING_DIR)"

        Write-Host "=========================================="
        Write-Host " Generated Terraform TFVARS"
        Write-Host "=========================================="

        if (-not (Test-Path "$(TFVARS_FILE)")) {

            Write-Error "terraform.tfvars was not generated."

            exit 1
        }

        Write-Host "terraform.tfvars generated successfully."

      displayName: 'Verify terraform.tfvars'


    # ------------------------------------------------------
    # TERRAFORM FORMAT
    # ------------------------------------------------------

    - powershell: |

        Set-Location "$(TF_WORKING_DIR)"

        Write-Host "=========================================="
        Write-Host " Terraform Format"
        Write-Host "=========================================="

        terraform fmt -recursive

        if ($LASTEXITCODE -ne 0) {

            Write-Error "Terraform formatting failed."

            exit $LASTEXITCODE
        }

        Write-Host "Terraform formatting completed successfully."

      displayName: 'Terraform Format'


    # ------------------------------------------------------
    # TERRAFORM INIT
    # ------------------------------------------------------

    - powershell: |

        Set-Location "$(TF_WORKING_DIR)"

        Write-Host "=========================================="
        Write-Host " Terraform Init"
        Write-Host "=========================================="

        terraform init `
          -backend-config="backend.conf" `
          -input=false `
          -no-color

        if ($LASTEXITCODE -ne 0) {

            Write-Error "Terraform init failed."

            exit $LASTEXITCODE
        }

        Write-Host "Terraform Init completed successfully."

      displayName: 'Terraform Init'


# ==========================================================
# STAGE 2
# TEST
# ==========================================================

- stage: Test

  displayName: 'Test'

  dependsOn: Build

  condition: succeeded()

  jobs:

  - job: TerraformTest

    displayName: 'Terraform Test'

    steps:

    # ------------------------------------------------------
    # CHECKOUT
    # ------------------------------------------------------

    - checkout: self

      displayName: 'Checkout Repository'


    # ------------------------------------------------------
    # GENERATE TFVARS
    # ------------------------------------------------------

    - task: PowerShell@2

      displayName: 'Generate terraform.tfvars'

      inputs:

        targetType: filePath

        filePath: '$(TFVARS_SCRIPT)'

        arguments: >
          -CsvPath "$(CSV_FILE)"
          -OutputPath "$(TFVARS_FILE)"

        pwsh: true


    # ------------------------------------------------------
    # TERRAFORM INIT
    # ------------------------------------------------------

    - powershell: |

        Set-Location "$(TF_WORKING_DIR)"

        Write-Host "=========================================="
        Write-Host " Terraform Init"
        Write-Host "=========================================="

        terraform init `
          -backend-config="backend.conf" `
          -input=false `
          -no-color

        if ($LASTEXITCODE -ne 0) {

            Write-Error "Terraform init failed."

            exit $LASTEXITCODE
        }

        Write-Host "Terraform Init successful."

      displayName: 'Terraform Init'


    # ------------------------------------------------------
    # TERRAFORM VALIDATE
    # ------------------------------------------------------

    - powershell: |

        Set-Location "$(TF_WORKING_DIR)"

        Write-Host "=========================================="
        Write-Host " Terraform Validate"
        Write-Host "=========================================="

        terraform validate -no-color

        if ($LASTEXITCODE -ne 0) {

            Write-Error "Terraform validation failed."

            exit $LASTEXITCODE
        }

        Write-Host "Terraform validation successful."

      displayName: 'Terraform Validate'

    # ------------------------------------------------------
    # INSTALL TFSEC (Added for Ubuntu Agent)
    # ------------------------------------------------------
    
    - bash: |
        curl -s https://raw.githubusercontent.com/aquasecurity/tfsec/master/scripts/install_linux.sh | bash
      displayName: 'Install tfsec on Ubuntu'

    # ------------------------------------------------------
    # VERIFY TFSEC
    # ------------------------------------------------------

    - powershell: |

        Write-Host "=========================================="
        Write-Host " tfsec Version"
        Write-Host "=========================================="

        tfsec --version

        if ($LASTEXITCODE -ne 0) {

            Write-Error "tfsec is not working."

            exit $LASTEXITCODE
        }

      displayName: 'Check tfsec'


    # ------------------------------------------------------
    # TFSEC SECURITY SCAN
    # ------------------------------------------------------

    - powershell: |

        Set-Location "$(TF_WORKING_DIR)"

        Write-Host "=========================================="
        Write-Host " tfsec Security Scan"
        Write-Host "=========================================="

        tfsec . --format default

        if ($LASTEXITCODE -ne 0) {

            Write-Error "tfsec security scan failed."

            exit $LASTEXITCODE
        }

        Write-Host "tfsec security scan passed successfully."

      displayName: 'tfsec Security Scan'


# ==========================================================
# STAGE 3
# PLAN
# ==========================================================

- stage: Plan

  displayName: 'Terraform Plan'

  dependsOn: Test

  condition: succeeded()

  jobs:

  - job: TerraformPlan

    displayName: 'Terraform Plan'

    steps:

    # ------------------------------------------------------
    # CHECKOUT
    # ------------------------------------------------------

    - checkout: self

      displayName: 'Checkout Repository'


    # ------------------------------------------------------
    # GENERATE TFVARS
    # ------------------------------------------------------

    - task: PowerShell@2

      displayName: 'Generate terraform.tfvars'

      inputs:

        targetType: filePath

        filePath: '$(TFVARS_SCRIPT)'

        arguments: >
          -CsvPath "$(CSV_FILE)"
          -OutputPath "$(TFVARS_FILE)"

        pwsh: true


    # ------------------------------------------------------
    # VERIFY TFVARS
    # ------------------------------------------------------

    - powershell: |

        Set-Location "$(TF_WORKING_DIR)"

        if (-not (Test-Path "$(TFVARS_FILE)")) {

            Write-Error "terraform.tfvars not found."

            exit 1
        }

        Write-Host "terraform.tfvars is available."

      displayName: 'Verify terraform.tfvars'


    # ------------------------------------------------------
    # TERRAFORM INIT
    # ------------------------------------------------------

    - powershell: |

        Set-Location "$(TF_WORKING_DIR)"

        Write-Host "=========================================="
        Write-Host " Terraform Init"
        Write-Host "=========================================="

        terraform init `
          -backend-config="backend.conf" `
          -input=false `
          -no-color

        if ($LASTEXITCODE -ne 0) {

            Write-Error "Terraform init failed."

            exit $LASTEXITCODE
        }

        Write-Host "Terraform Init successful."

      displayName: 'Terraform Init'


    # ------------------------------------------------------
    # TERRAFORM PLAN
    # ------------------------------------------------------

    - powershell: |

        Set-Location "$(TF_WORKING_DIR)"

        Write-Host "=========================================="
        Write-Host " Terraform Plan"
        Write-Host "=========================================="

        terraform plan `
          -input=false `
          -out=tfplan `
          -no-color

        if ($LASTEXITCODE -ne 0) {

            Write-Error "Terraform plan failed."

            exit $LASTEXITCODE
        }

        Write-Host "Terraform Plan completed successfully."

      displayName: 'Terraform Plan'


    # ------------------------------------------------------
    # PUBLISH TERRAFORM PLAN
    # ------------------------------------------------------

    - task: PublishPipelineArtifact@1

      displayName: 'Publish Terraform Plan'

      inputs:

        targetPath: '$(TF_WORKING_DIR)/tfplan'

        artifact: 'terraform-plan'

        publishLocation: 'pipeline'


# ==========================================================
# STAGE 4
# TELEGRAM NOTIFICATION
# ==========================================================

- stage: Notify
  
  displayName: 'Notifications'
  
  condition: always()
  
  dependsOn:
  - Build
  - Test
  - Plan

  jobs:
  - job: TelegramAlert
    
    displayName: 'Send Telegram Alert'
    
    steps:
    
    # ------------------------------------------------------
    # SUCCESS NOTIFICATION
    # ------------------------------------------------------
    - bash: |
        MESSAGE="✅ <b>ADO Pipeline Success!</b>%0A%0A📦 <b>Project:</b> $(System.TeamProject)%0A⚙️ <b>Pipeline:</b> $(Build.DefinitionName)%0A🔢 <b>View Run:</b> <a href='$(System.CollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)'>Run $(Build.BuildNumber)</a>"
        curl -s -X POST "https://api.telegram.org/bot$(BOT_TOKEN)/sendMessage" \
          -d chat_id="$(CHAT_ID)" \
          -d text="$MESSAGE" \
          -d parse_mode="HTML" \
          -d disable_web_page_preview="true"
      
      displayName: 'Telegram Alert - Success'
      
      condition: and(succeeded('Build'), succeeded('Test'), succeeded('Plan'))

    # ------------------------------------------------------
    # FAILURE NOTIFICATION
    # ------------------------------------------------------
    - bash: |
        MESSAGE="❌ <b>ADO Pipeline Failed!</b>%0A%0A📦 <b>Project:</b> $(System.TeamProject)%0A⚙️ <b>Pipeline:</b> $(Build.DefinitionName)%0A🚨 <b>Check Logs:</b> <a href='$(System.CollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)'>Click Here</a>"
        curl -s -X POST "https://api.telegram.org/bot$(BOT_TOKEN)/sendMessage" \
          -d chat_id="$(CHAT_ID)" \
          -d text="$MESSAGE" \
          -d parse_mode="HTML" \
          -d disable_web_page_preview="true"
      
      displayName: 'Telegram Alert - Failed'
      
      condition: or(failed('Build'), failed('Test'), failed('Plan'))